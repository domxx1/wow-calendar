name: Add WoW Live Q&A calendar event

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-wow-live-qa.yml'

permissions:
  contents: write

jobs:
  add-event:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add Live Q&A event
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('manual-events.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          events = data.setdefault('events', [])
          uid = 'wow-live-qa-20260917@wowcalendarexport'
          if not any(event.get('uid') == uid for event in events):
              events.append({
                  'uid': uid,
                  'title': 'World of Warcraft – Live-Fragerunde nach der BlizzCon',
                  'start': '2026-09-17T19:00:00+02:00',
                  'end': '2026-09-17T20:00:00+02:00',
                  'type': 'event',
                  'category': 'WoW Live',
                  'estimated': False,
                  'description': 'Offizielle World-of-Warcraft-Live-Fragerunde mit Mitgliedern des Entwicklerteams nach den Enthüllungen der BlizzCon 2026. Themen können Retail und World of Warcraft: Forever umfassen. Stream auf den offiziellen Warcraft-Kanälen bei Twitch und YouTube; anschließend soll eine Aufzeichnung verfügbar sein. Offiziell bestätigt ist der Start um 19:00 Uhr MESZ. Eine Endzeit wurde nicht angegeben; der Kalenderblock ist daher zunächst auf eine Stunde gesetzt.',
                  'source': 'https://worldofwarcraft.blizzard.com/de-de/news/24303312'
              })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate iCalendar feed
        run: python scripts/update_ics_revisions.py

      - name: Commit calendar update
        shell: bash
        run: |
          if git diff --quiet -- manual-events.json WoW-Calendar.ics event-revisions.json; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual-events.json WoW-Calendar.ics event-revisions.json
          git commit -m "Add World of Warcraft Live Q&A"
          git push
