name: Maintain iCalendar revisions

on:
  push:
    branches:
      - main
    paths:
      - 'WoW-Calendar.ics'
      - 'scripts/update_ics_revisions.py'
      - '.github/workflows/ics-revisions.yml'

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add revision metadata
        run: python scripts/update_ics_revisions.py

      - name: Commit revision metadata
        shell: bash
        run: |
          if git diff --quiet -- WoW-Calendar.ics event-revisions.json; then
            echo "No revision metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WoW-Calendar.ics event-revisions.json
          git commit -m "Update iCalendar revision metadata"
          git push
